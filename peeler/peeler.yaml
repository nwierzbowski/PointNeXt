batch_size: 16
criterion:
  NAME: BCEAffinityPeelerLoss
dataset:
  asset_scale_std:
  - -1.0
  - 1.0
  max_asset_fragments: 60
  max_assets_per_soup: 12
  min_assets_per_soup: 1
  scene_scale:
  - -3.0
  - 3.0
  seed: 42
  translation_scale:
  - -2.0
  - 1.9
embedding_noise_sigma: 0.0
epochs: 40
lr: 0.006
lr_pct_start: 0.1
model:
  NAME: PurelyRelationalPeeler
  downsample_schedule:
  - 8
  - 8
  - 8
  - 8
optimizer:
  NAME: adamw
  weight_decay: 0.01
training:
  device: cuda
  ema_alpha: 0.1
  report_interval: 40000
