batch_size: 32
criterion:
  NAME: PeelerLoss
dataset:
  NAME: PeelerDataset
  asset_scale_std:
  - -1.0
  - 1.0
  max_asset_fragments: 50
  max_assets_per_soup: 12
  min_assets_per_soup: 2
  num_assets_per_soup: 6
  scene_scale:
  - -3.0
  - 3.0
  seed: 42
  translation_scale:
  - 0.0
  - 1.9
  zero_embeddings: false
embedding_noise_sigma: 0.005
epochs: 50
lr: 0.0001
model:
  NAME: Peeler
  anchor_drop_rate: 0.0
  anchor_proj_dim: 64
  attention_blocks: 1
  attention_heads: 1
  embed_dim: 256
  feat_dim: 64
  lift_drop_rate: 0.0
  rel_hidden_dim: 128
  relation_drop_rate: 0.0
  spatial_only: true
onecycle:
  anneal_strategy: cos
  div_factor: 100
  final_div_factor: 10
  pct_start: 0.2
optimizer:
  NAME: adamw
  weight_decay: 0.01
sched: onecycle
training:
  device: cuda
  ema_alpha: 0.1
  report_interval: 40000
