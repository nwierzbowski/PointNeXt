batch_size: 32
criterion:
  NAME: SparseFocalBCELoss
  alpha: 0.5
  gamma: 2.0
dataset:
  max_fragments: 600
  seed: 42
eta_min: 1.0e-05
evaluation:
  ari_topk: 16
grad_accum_steps: 1
lr: 0.001
lr_pct_start: 0.1
model:
  NAME: PurelyRelationalPeeler
  attn_dropout: 0.0
  downsample_schedule:
  - 16
  - 16
  - 16
  - 16
  - 16
  - 16
  highway_dim: 32
  mlp_sizes:
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  output_dropout: 0.0
  pairwise_dropout: 0.0
  temperature: 0.1
  top_k: 32
num_epochs: 200
optimizer:
  NAME: adamw
  weight_decay: 0.1
training:
  device: cuda
  ema_alpha: 0.0
  report_interval: 10
validation:
  batch_size: 32
  max_batches: 10
