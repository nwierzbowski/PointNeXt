criterion:
  NAME: SparseFocalBCELoss
  alpha: 0.5
  gamma: 0.0
dataset:
  asset_dropout_prob: 0.0
  asset_swap_prob: 0.0
  burst_prob: 0.5
  max_fragments: 600
  seed: 42
evaluation:
  ari_topk:
    102-300: 12
    12-26: 8
    2-11: 6
    27-51: 25
    300+: 12
    52-101: 6
model:
  NAME: PurelyRelationalPeeler
  attn_dropout: 0.0
  downsample_schedule:
  - 16
  - 16
  - 16
  - 16
  - 16
  - 16
  highway_dim: 32
  mlp_sizes:
  - 128
  - 128
  - 128
  - 128
  - 128
  - 128
  output_dropout: 0.0
  pairwise_dropout: 0.0
  top_k: 32
optimizer:
  NAME: adamw
  weight_decay: 0.1
training:
  batch_size: 32
  device: cuda
  ema_alpha: 0.0
  eta_min: 1.0e-05
  grad_accum_steps: 1
  lr: 0.001
  lr_pct_start: 0.1
  num_epochs: 200
  report_interval: 10
validation:
  batch_size: 32
  max_batches: 10
